<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img" aria-label="Recommended five-stage build order: visual-only MVP, then add audio, then add cross-modal sync checking with late fusion, then add explanation and calibration, then optional stretch goals of learned fusion, segmentation localization, and robustness testing.">
  <defs>
    <style>
      :root{
        --bg:#F5F6F8; --surface:#FFFFFF; --fg:#1B1F24; --muted:#6B7280; --border:#D7DBE0; --accent:#0E7490;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#14181D; --surface:#1D2228; --fg:#E7EAEE; --muted:#8B93A1; --border:#333A42; --accent:#22A6C4;
        }
      }
      text{ font-family:'IBM Plex Mono','Segoe UI',monospace; fill:var(--fg); }
    </style>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="300" style="fill:var(--bg)"/>

  <g style="color:var(--fg)">

    <text x="40" y="26" font-size="10.5" fill="var(--muted)" letter-spacing="1">BUILD ORDER →</text>
    <line x1="40" y1="44" x2="1350" y2="44" stroke="var(--border)" stroke-width="1.2"/>

    <text x="40" y="66" font-size="11" fill="var(--accent)" font-weight="700">1</text>
    <rect x="40" y="80" width="230" height="140" rx="9" style="fill:var(--surface);stroke:var(--accent)" stroke-width="1.5"/>
    <text x="60" y="104" font-weight="700" font-size="12" fill="var(--accent)">VISUAL-ONLY MVP</text>
    <text x="60" y="126" font-size="11">spatial + frequency</text>
    <text x="60" y="144" font-size="11">branch → score</text>
    <text x="60" y="162" font-size="11">+ Grad-CAM heatmap</text>
    <text x="60" y="246" font-size="10" fill="var(--muted)">dataset: FaceForensics++</text>

    <path d="M270,150 H310" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#a2)"/>

    <text x="310" y="66" font-size="11" fill="var(--accent)" font-weight="700">2</text>
    <rect x="310" y="80" width="230" height="140" rx="9" style="fill:var(--surface);stroke:var(--accent)" stroke-width="1.5"/>
    <text x="330" y="104" font-weight="700" font-size="12" fill="var(--accent)">+ AUDIO BRANCH</text>
    <text x="330" y="126" font-size="11">raw-waveform / SSL</text>
    <text x="330" y="144" font-size="11">train on ASVspoof2019</text>
    <text x="330" y="162" font-size="11">→ test on OOD set</text>
    <text x="330" y="238" font-size="10" fill="var(--muted)">dataset: ASVspoof2019 →</text>
    <text x="330" y="252" font-size="10" fill="var(--muted)">WaveFake / In-the-Wild</text>

    <path d="M540,150 H580" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#a2)"/>

    <text x="580" y="66" font-size="11" fill="var(--accent)" font-weight="700">3</text>
    <rect x="580" y="80" width="230" height="140" rx="9" style="fill:var(--surface);stroke:var(--accent)" stroke-width="1.5"/>
    <text x="600" y="104" font-weight="700" font-size="12" fill="var(--accent)">+ CROSS-MODAL</text>
    <text x="600" y="126" font-size="11">SyncNet + viseme check</text>
    <text x="600" y="144" font-size="11">→ late fusion</text>
    <text x="600" y="162" font-size="11">(logistic regression)</text>
    <text x="600" y="246" font-size="10" fill="var(--muted)">dataset: FakeAVCeleb</text>

    <path d="M810,150 H850" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#a2)"/>

    <text x="850" y="66" font-size="11" fill="var(--accent)" font-weight="700">4</text>
    <rect x="850" y="80" width="230" height="140" rx="9" style="fill:var(--surface);stroke:var(--accent)" stroke-width="1.5"/>
    <text x="870" y="104" font-weight="700" font-size="12" fill="var(--accent)">+ EXPLANATION</text>
    <text x="870" y="126" font-size="11">structured evidence →</text>
    <text x="870" y="144" font-size="11">LLM / template +</text>
    <text x="870" y="162" font-size="11">temperature calibration</text>
    <text x="870" y="246" font-size="10" fill="var(--muted)">— (calibration holdout)</text>

    <path d="M1080,150 H1120" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a2)"/>

    <text x="1120" y="66" font-size="11" fill="var(--muted)" font-weight="700">5</text>
    <rect x="1120" y="80" width="230" height="140" rx="9" style="fill:var(--surface);stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1140" y="104" font-weight="700" font-size="12" fill="var(--muted)">STRETCH GOALS</text>
    <text x="1140" y="126" font-size="11" fill="var(--muted)">learned fusion,</text>
    <text x="1140" y="144" font-size="11" fill="var(--muted)">segmentation masks,</text>
    <text x="1140" y="162" font-size="11" fill="var(--muted)">robustness + fallback</text>
    <text x="1140" y="238" font-size="10" fill="var(--muted)">dataset: Celeb-DF ·</text>
    <text x="1140" y="252" font-size="10" fill="var(--muted)">PolyGlotFake · compression augs</text>

  </g>
</svg>
